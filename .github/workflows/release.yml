name: Release

# Fires ONLY when a human pushes a semver tag (e.g. `v1.5.0`). It never tags or
# releases on its own — pushing the tag is the explicit, human gate. On a tag it
# re-runs the full quality gate, publishes a GitHub Release with auto-generated
# notes, and publishes the `agentroom` npx bootstrapper to npm **with provenance**
# (ADR-0014). The npm job needs the `NPM_TOKEN` repo secret; when it is absent the
# job skips with a visible notice instead of failing, so the GitHub Release is
# never blocked. AgentRoom is a local-only app — there are no container images.
#
# To cut a release (human):
#   git tag v1.5.0 && git push origin v1.5.0
# To publish npm after adding NPM_TOKEN later: re-run the publish-npm job on the
# tag's existing workflow run (Actions UI → the run → Re-run job; via CLI,
# `gh run rerun <run-id> --failed` or rerun by the numeric job id). NEVER delete
# and re-push a released tag — the bin published from it targets that tag's
# content; cut a new patch version instead.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read # least privilege; `release` escalates to contents:write and `publish-npm` to id-token:write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      # Unconditional (does NOT depend on NPM_TOKEN): a tag whose source
      # self-identifies as a different version must never release — and the tag
      # ruleset makes a mis-tagged release permanently unfixable.
      - name: Verify tag matches package.json version
        run: |
          PKG_V="$(node -p "require('./package.json').version")"
          if [ "v${PKG_V}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::package.json version ${PKG_V} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec knip
      - run: pnpm test:coverage
      - run: pnpm --filter web build

  release:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify tag is strict semver (vMAJOR.MINOR.PATCH[-prerelease])
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a valid release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so release notes can diff from the previous tag
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  # Publishes the tiny `agentroom` npx bootstrapper (bin + README + LICENSE — no app
  # code; see ADR-0014) with npm provenance. Gated on the same human-pushed tag and
  # a green `verify`. Skips (visibly, without failing the release) when NPM_TOKEN is
  # not configured.
  publish-npm:
    # Needs `release` too: if the GitHub Release fails, npm must not publish a
    # version whose release page doesn't exist (or describes different content).
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm --provenance
    steps:
      - name: Check NPM_TOKEN presence
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm publish skipped::NPM_TOKEN secret is not set. The GitHub Release is unaffected. Add the secret, then re-run this job on this tag (gh run rerun --job publish-npm) to publish."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json version
        if: steps.token.outputs.present == 'true'
        run: |
          PKG_V="$(node -p "require('./package.json').version")"
          if [ "v${PKG_V}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::package.json version ${PKG_V} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Publish to npm (provenance)
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
