# gitleaks config. Default rules stay on. The allowlist below exempts ONLY the exact
# literal fake values used as test fixtures (a fake JWT + a fake hex key) — never a
# whole file or a whole directory. A real secret is still caught wherever it lands,
# including inside a *.test.ts file or an .env.example: verified 2026-07-29 by (1)
# scanning full history with useDefault=true and NO allowlist at all, which surfaced
# exactly these same 5 fake-fixture matches and nothing else, and (2) confirming a
# synthetic realistic secret dropped into a throwaway *.test.ts file IS caught under
# this config (an equivalent whole-path exemption misses it — 0 bytes scanned).
#
# pnpm-lock.yaml IS excluded, but not by anything in this file. gitleaks' bundled
# default config carries a global, path-based allowlist entry for lockfiles
# (`(?:^|/)(?:deno.lock|npm-shrinkwrap.json|package-lock.json|pnpm-lock.yaml|
# yarn.lock)$`, among others), and `[extend] useDefault = true` below inherits it —
# the file is skipped before any rule ever sees its bytes. Removing the old repo-level
# entry here was a no-op; the previous comment's claim that "scanning it produces zero
# findings" implied the content was scanned and happened to be clean, which is false.
#
# This was verified 2026-07-29, three ways, against a scratch copy (nothing kept in
# the repo or history): (1) a credentialed `https://deploy:ghp_...@npm.pkg.github.com/
# x.tgz` line appended to a copy of pnpm-lock.yaml, scanned with this exact config ->
# "scanned ~0 bytes" and no leak — the file is never opened, not merely pattern-missed;
# (2) the identical planted line PLUS an extra [[rules]] entry added on top of
# useDefault=true, specifically written to match credentialed URLs -> still "scanned
# ~0 bytes" of the lockfile (only the tiny config file itself was scanned) — proving an
# extending config cannot claw back a path the default allowlist already excluded,
# because gitleaks merges allowlists additively (they can only add exclusions, never
# remove one inherited via useDefault); (3) the identical bytes renamed to
# deps-manifest.yaml, same config, same run -> caught immediately as rule `github-pat`.
#
# Decision: accept the inherited exclusion (option (a)), not opt out of it. A scoped
# re-inclusion is not achievable from THIS config: as (2) shows, useDefault=true's path
# allowlist cannot be overridden by anything added here. The only way to scan
# pnpm-lock.yaml would be to stop using useDefault (hand-maintain every upstream rule
# ourselves — large, fragile, out of scope) or run a second, non-extending gitleaks
# pass restricted to the lockfile in CI (a new pipeline step whose false-positive rate
# against ~200 lines of integrity hashes and resolution metadata has not been
# evaluated). Neither is justified by a single item in a hardening sweep; if a
# concrete lockfile-leak scenario becomes reason for it, do that as its own reviewed
# change, not a silent side effect of this comment.
[extend]
useDefault = true

[allowlist]
description = "Exact fake fixture values used by tests (verified 2026-07-29, not real secrets)."
regexes = [
  # packages/shared/test/redact.test.ts + apps/web/lib/__tests__/redact.test.ts: a fake
  # JWT used to prove the redactor's jwt-pattern rule strips it. Anchored (^...$)
  # because gitleaks' default regexTarget is the secret itself: unanchored, this
  # allowlist entry would suppress any secret that merely CONTAINS this literal as a
  # substring (e.g. the same fixture with extra characters appended — a different,
  # real-looking token) instead of only the exact fixture value.
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dGVzdHNpZ25hdHVyZQ$''',
  # bridge/test/resolve-runtime-provider.test.ts + bridge/test/credential-crypto.test.ts:
  # a fake 32-byte hex key (sequential 00..ff byte pairs, repeated) used as a
  # CREDENTIAL_ENCRYPTION_KEY fixture — never a real key. Anchored for the same reason.
  '''^00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff$''',
]
